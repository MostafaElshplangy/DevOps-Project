name: CI/CD Pipeline to K8s

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ahmedsalahelsayed/hello-world-devops:${{ github.run_number }}

    - name: Update Kubernetes manifest with yq
      uses: mikefarah/yq@v4
      with:
        cmd: yq -i '.spec.template.spec.containers[0].image = "ahmedsalahelsayed/hello-world-devops:${{ github.run_number }}"' deployment-service-hpa.yaml

    - name: Authenticate to Kubernetes
      uses: azure/k8s-set-context@v4
      with:
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Apply Kubernetes configuration
      run: kubectl apply -f deployment-service-hpa.yaml
